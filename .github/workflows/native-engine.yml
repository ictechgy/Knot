name: Build independent native engine preview
on:
  push:
    branches: ['knot-native-engine-*']
  workflow_dispatch:
    inputs:
      media_only:
        description: "Compile native Windows media and run synthetic codec only"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'native-engine/**'
      - 'scripts/build_native_engine.py'
      - 'scripts/native_updates.py'
      - 'scripts/tests/test_native_updates.py'
      - 'packaging/updates/native-publisher.json'
      - '.gitattributes'
      - 'scripts/tests/test_source_checkout.py'
      - 'scripts/test_windows_updates.py'
      - 'scripts/test_windows_launcher.py'
      - 'scripts/test_reverse_client.py'
      - 'scripts/reverse_client.py'
      - 'scripts/reverse_qr.py'
      - 'scripts/update_runtime.py'
      - 'scripts/update_version.py'
      - 'scripts/update_windows.py'
      - 'scripts/windows_check_record.py'
      - 'scripts/windows_resources.py'
      - 'scripts/render_native_visual_fixture.py'
      - 'scripts/verify_native_installer.ps1'
      - 'scripts/build_snapshot.py'
      - 'scripts/check_source_checkout.py'
      - 'scripts/tests/test_build_snapshot.py'
      - 'scripts/tests/test_build_native_engine.py'
      - 'Assets/Brand/**'
      - 'LICENSE'
      - '.github/workflows/native-engine.yml'
permissions:
  contents: read
concurrency:
  group: native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-native:
    if: github.event_name != 'workflow_dispatch' || !inputs.media_only
    needs: windows-native
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 scripts/check_source_checkout.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_build_snapshot.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_build_native_engine.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_native_updates.py
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-windows-preview
          path: build/native-engine/windows-fixtures
      - run: python3 scripts/build_native_engine.py --platform macos
        env:
          KNOT_NATIVE_WINDOWS_FIXTURES: ${{ github.workspace }}/build/native-engine/windows-fixtures
          KNOT_NATIVE_REQUIRE_WINDOWS_FIXTURES: '1'
          KNOT_NATIVE_WINDOWS_PERSISTENT_CERTIFICATE: ${{ github.workspace }}/build/native-engine/windows-fixtures/persistent-certificate.cer
      - name: Upload only fresh synthetic Mac UI fixtures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-macos-ui
          path: |
            build/native-engine/macos/visuals/
            build/native-engine/macos/native-ui-visual-checks.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-macos-preview
          path: |
            build/native-engine/macos/*.dmg
            build/native-engine/macos/*.zip
            build/native-engine/macos/*.tar.gz
            build/native-engine/macos/*.json
            build/native-engine/macos/*.a
            build/native-engine/macos/KnotNativePairing-LICENSE.txt
            build/native-engine/macos/SHA256SUMS
            build/native-engine/macos/evidence/
          if-no-files-found: error
      - name: Collect only this fresh test process's crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          output=Path('build/native-engine/macos/evidence/crashes')
          output.mkdir(parents=True,exist_ok=True)
          root=Path.home()/'Library/Logs/DiagnosticReports'
          for pattern in ['KnotNativePreviewPackageTests*.ips','swiftpm-testing-helper*.ips']:
              for path in sorted(root.glob(pattern))[-4:]:
                  if path.is_file() and not path.is_symlink() and path.stat().st_size<=2_000_000:
                      shutil.copy2(path,output/path.name)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: native-macos-failed-diagnostics
          path: |
            build/native-engine/macos/evidence/
            build/native-engine/macos/NATIVE-INPUTS.json
          if-no-files-found: warn
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/check_source_checkout.py
      - run: python -B -m unittest discover -s scripts/tests -p test_build_native_engine.py
      - run: python -B -m unittest discover -s scripts/tests -p test_native_updates.py
      - name: Install pinned Inno Setup compiler on the disposable build runner
        if: github.event_name != 'workflow_dispatch' || !inputs.media_only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $download = Join-Path $env:RUNNER_TEMP 'knot-native-inno-7.1.0.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Native compiler installer SHA256 mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'KnotNativeInno'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $install + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native compiler installation failed' }
          "INNO_COMPILER=$install\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: github.event_name != 'workflow_dispatch' || !inputs.media_only
        run: python scripts/build_native_engine.py --platform windows
      - if: github.event_name == 'workflow_dispatch' && inputs.media_only
        run: python scripts/build_native_engine.py --platform windows --media-only
      - name: Upload only fresh synthetic Windows UI fixtures
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.media_only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-windows-ui
          path: |
            build/native-engine/windows/visuals/
            build/native-engine/windows/native-ui-visual-checks.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-windows-preview
          path: |
            build/native-engine/windows/Knot-Native-*.exe
            build/native-engine/windows/KnotNativeMedia.dll
            build/native-engine/windows/KnotNativePairing.dll
            build/native-engine/windows/KnotNativePairing-LICENSE.txt
            build/native-engine/windows/*.tar.gz
            build/native-engine/windows/*.json
            build/native-engine/windows/*.h264
            build/native-engine/windows/*.cer
            build/native-engine/windows/*.sha256
            build/native-engine/windows/SHA256SUMS
            build/native-engine/windows/evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: native-windows-failed-diagnostics
          path: |
            build/native-engine/windows/evidence/
            build/native-engine/windows/NATIVE-INPUTS.json
            build/native-engine/windows/synthetic.h264
            build/native-engine/windows/synthetic-codec.json
            build/native-engine/windows/synthetic-4k.h264
            build/native-engine/windows/synthetic-codec-4k.json
          if-no-files-found: warn
